<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ders 6 - Linkler</title>
    </head>
    <body>
        <h1>Linkler</h1>

        <h2>Faydalı Kaynaklar</h2>

        <!--Linke tıklayınca o sayfayı açar -->
        <p>
            Web yazılım eğitimlerimizi incelemek için
            <a href="https://www.leadercoders.com">buraya tıklayın</a>.
        </p>

        <!-- Henüz hedef sayfası hazır olmayan menü ve butonlarda metni tıklanabilir tutmak için href="#" (kare) kullanılır. -->
        <p>
            Eğitmenlerimizi tanımak için
            <a href="#">buraya tıklayın</a>
        </p>
    </body>
</html>
