<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ders 6 - Dış Bağlantılar ve E-Posta Linkleri</title>
    </head>
    <body>
        <h1>Dış Bağlantılar ve E-Posta Linkleri</h1>

        <h2>Dış Bağlantı Örneği</h2>

        <!-- target=”_blank” Kullanıcının mevcut siteden kopmaması için bağlantıyı yeni bir tarayıcı sekmesinde açar. -->
        <p>
            Daha fazla bilgi için
            <a href="https://www.wikipedia.org" target="_blank"
                >Wikipedia Sayfasını</a
            >
            ziyaret edebilirsiniz.
        </p>

        <h2>E-Posta Örneği</h2>

        <!--mailto bağlantısı: e-posta adresine yönlendirir -->
        <p>
            Eğitmen ekibe soru sormak için
            <a href="mailto:iletisim@leadercoders.com">bize e-posta gönderin</a
            >.
        </p>

        <p>
            Eğitmen ekibe soru sormak için
            <a
                href="mailto:iletisim@leadercoders.com?subject=Kurs hakkında bilgi almak istiyorum."
                >bize e-posta gönderin</a
            >.
        </p>

        <h2>Telefon Örneği</h2>

        <!-- tel: bağlantısı aramaya yönlendirir. -->
        <!-- Özel numaraları kullanmamak iyi olur. -->
        <p><a href="tel:+905674257898">Hemen Bizi Arayın!</a></p>
    </body>
</html>
