<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ders 6 - Dış Bağlantılar ve E-Posta Linkleri</title>
    </head>
    <body>
        <h1>Dış Bağlantılar ve E-Posta Linkleri</h1>

        <h2>Dış Bağlantı Örneği</h2>
        
        <!-- target=”_blank” Kullanıcının mevcut siteden kopmaması için bağlantıyı yeni bir tarayıcı sekmesinde açar. -->
        <p>Daha fazla bilgi için <a href="https://www.wikipedia.org" target="_blank">Wikipedia sayfasını</a> ziyaret edebilirsiniz.</p>


        <h2>E-Posta Örneği</h2>

        <!-- href="mailto:..." formatıyla tıklandığı anda cihazın varsayılan e-posta uygulamasını başlatır. -->
        <p>
            Eğitmen ekibe soru sormak için
            <a href="mailto:iletisim@leadercoders.com">bize e-posta gönderin</a
            >.
        </p>

         <p>
            Eğitmen ekibe soru sormak için
            <a href="mailto:iletisim@leadercoders.com?subject=Kurs hakkında bilgi almak istiyorum.">bize e-posta gönderin</a
            >.
        </p>

        <h2>Telefon Örneği</h2>

        <!--href="tel:..." formatıyla tıklandığı anda arama uygulmasını başlatır -->
        <!-- Özel numaralarınızı kullanmamak mantıklı. -->
        <p><a href="tel:+905674257898">Hemen Bizi Arayın!</a></p>
    </body>
</html>
